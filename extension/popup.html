<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>IME Enter Guard</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, sans-serif; font-size: 13px; width: 280px; margin: 0; padding: 12px; line-height: 1.5; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .host { font-weight: 600; word-break: break-all; }
  label { display: flex; gap: 6px; align-items: flex-start; margin: 8px 0 12px; cursor: pointer; }
  .note { color: GrayText; font-size: 12px; }
  h2 { font-size: 12px; margin: 12px 0 4px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 2px 0; }
  button { font-size: 12px; }
</style>
</head>
<body>
<h1>IME Enter Guard</h1>
<div id="current">
  <div>このサイト: <span class="host" id="host"></span></div>
  <label>
    <input type="checkbox" id="toggle">
    <span>Enter＝改行、⌘+Enter＝送信 にする</span>
  </label>
</div>
<p class="note" id="unavailable" hidden>このページでは設定できません。普通のWebページを開いてから押してください。</p>
<p class="note">変換確定のEnterで送信されない機能は、全サイトで常に有効です。</p>

<h2>登録済みのサイト</h2>
<ul id="list"></ul>

<script src="popup.js"></script>
</body>
</html>
